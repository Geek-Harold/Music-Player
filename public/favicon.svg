<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- SONA tab icon: a vinyl record with the app's mauve label and yellow spindle.
       The mauve rim keeps the dark disc visible on dark browser tab bars. -->
  <defs>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98a99"/>
      <stop offset="1" stop-color="#6d4458"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#2e2530" stroke="#b98a99" stroke-width="3"/>
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#f5efe4" stroke-opacity=".16" stroke-width="1.5"/>
  <path d="M13.2 22.5A21.5 21.5 0 0 1 24 12.4" fill="none" stroke="#f5efe4" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="16" fill="url(#label)"/>
  <circle cx="32" cy="32" r="5.5" fill="#e8c46a"/>
</svg>
