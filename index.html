<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f0e9de" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c161d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="SONA — a vinyl-inspired music player for your local listening collection." />
    <title>SONA — Vinyl Music Player</title>
    <!-- Apply a saved Light/Dark choice before anything paints, so there's no flash of the other theme. -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem("sona:theme"));
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) { /* no saved choice: follow the system */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
